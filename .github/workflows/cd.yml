name: Occupify Gateway CD flow

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: be-deploy-gateway
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/occupify-gateway
  GITOPS_REPO: Occupify/occupify-gitops
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-ghcr:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  deploy:
    name: Deploy Gateway Service
    needs: build-and-push-ghcr
    runs-on: [self-hosted, backend]

    steps:
      - name: Checkout GitOps Manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: gitops-manifests
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITOPS_PAT || github.token }}

      - name: Setup Rootless Podman Environment
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Sync Permanent Configs & Environment
        working-directory: gitops-manifests
        env:
          SECRET_GATEWAY_OCID: ${{ secrets.SECRET_GATEWAY_OCID }}
        run: |
          mkdir -p ~/.config/systemd/user/git-ops/compose
          mkdir -p ~/.config/systemd/user/git-ops/env
          mkdir -p ~/.config/systemd/user/git-ops/nginx/logs
          mkdir -p ~/.config/systemd/user/git-ops/nginx/run
          mkdir -p ~/.config/systemd/user/git-ops/nginx/body

          echo "Inject gateway.env..."
          oci secrets secret-bundle get \
            --secret-id "$SECRET_GATEWAY_OCID" \
            --auth instance_principal \
            --stage CURRENT \
            --query 'data."secret-bundle-content".content' \
            --raw-output | base64 --decode > ~/.config/systemd/user/git-ops/env/gateway.env

          echo "Sync compose and service units..."
          cp compose/docker.*.compose.yml ~/.config/systemd/user/git-ops/compose/
          cp service/occupify-*.service ~/.config/systemd/user/
          cp nginx/default.conf ~/.config/systemd/user/git-ops/nginx/default.conf

      - name: Prune Old OCI Secret Versions
        env:
          SECRET_GATEWAY_OCID: ${{ secrets.SECRET_GATEWAY_OCID }}
        run: |
          DELETION_TIME=$(date -u -d "+1 day 5 minutes" +"%Y-%m-%dT%H:%M:%SZ")

          oci vault secret-version list \
            --secret-id "$SECRET_GATEWAY_OCID" \
            --auth instance_principal \
            --raw-output | \
            jq -r '.data | map(select(."time-of-deletion" == null)) | .[3:][]."version-number"' | \
            while read -r VER; do
              [ -z "$VER" ] && continue
              echo "Scheduling deletion for Version $VER at $DELETION_TIME..."
              oci vault secret-version schedule-deletion \
                --secret-id "$SECRET_GATEWAY_OCID" \
                --secret-version-number "$VER" \
                --time-of-deletion "$DELETION_TIME" \
                --auth instance_principal
            done

      - name: Deploy Gateway Service
        working-directory: gitops-manifests
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          make be-gateway

      - name: Verify Backend Service
        run: |
          sleep 5s
          echo "===== CONTAINERS ====="
          podman ps -a --filter name=occupify-gateway

          echo "===== STATUS & EXIT CODE ====="
          podman inspect occupify-gateway --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}}'

          echo "===== RECENT LOGS ====="
          podman logs --tail 50 occupify-gateway

          echo "===== PORT MAPPING ====="
          podman port occupify-gateway
