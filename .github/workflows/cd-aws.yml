name: Occupify Gateway CD flow (AWS)

on:
  push:
    branches:
      - main-aws
  workflow_dispatch:

concurrency:
  group: be-deploy-gateway-aws
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/occupify-gateway
  GITOPS_REPO: Occupify/occupify-gitops
  AWS_REGION: ap-southeast-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  build-and-push-ghcr:
    name: Build and Push Docker Image to GHCR
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest-aws
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  deploy:
    name: Deploy Gateway Service (AWS)
    needs: build-and-push-ghcr
    runs-on: [self-hosted, aws-gateway]

    steps:
      - name: Checkout GitOps Manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: gitops-manifests
          ref: main-aws
          token: ${{ secrets.GITOPS_PAT || github.token }}

      - name: Setup Rootless Podman Environment
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Sync Permanent Configs & Environment
        working-directory: gitops-manifests
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
          AWS_SECRET_GATEWAY_ID: ${{ secrets.AWS_SECRET_GATEWAY || 'occupify/prod/gateway' }}
        run: |
          mkdir -p ~/.config/systemd/user/git-ops/compose/gateway
          mkdir -p ~/.config/systemd/user/git-ops/env
          mkdir -p ~/.config/systemd/user/git-ops/nginx/logs
          mkdir -p ~/.config/systemd/user/git-ops/nginx/run
          mkdir -p ~/.config/systemd/user/git-ops/nginx/body

          echo "Inject gateway.env from AWS Secrets Manager..."
          aws secretsmanager get-secret-value \
            --secret-id "$AWS_SECRET_GATEWAY_ID" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text > ~/.config/systemd/user/git-ops/env/gateway.env

          echo "Sync gateway manifests, systemd unit, and nginx config..."
          cp -rf compose/gateway ~/.config/systemd/user/git-ops/compose/
          cp service/occupify-be-gateway.service ~/.config/systemd/user/
          cp nginx/default.conf ~/.config/systemd/user/git-ops/nginx/default.conf

      - name: Deploy Gateway Service
        working-directory: gitops-manifests
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          make be-gateway

      - name: Verify Backend Service
        run: |
          sleep 5s
          echo "===== CONTAINERS ====="
          podman ps -a --filter name=occupify-gateway

          echo "===== STATUS & EXIT CODE ====="
          podman inspect occupify-gateway --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}}'

          echo "===== RECENT LOGS ====="
          podman logs --tail 50 occupify-gateway

          echo "===== PORT MAPPING ====="
          podman port occupify-gateway
